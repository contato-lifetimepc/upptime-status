# ==============================================================
# UPPTIME CONFIGURATION - LIFETIME/LIFETRIAL STATUS PAGE
# ==============================================================

# Informações do proprietário
owner: contato-lifetimepc
repo: upptime-status

# Sites e APIs para monitorar
sites:
  # ============ LIFETRIAL ============
  - name: LifeTrial App
    url: https://lifetrial.lifetimepc.com.br
    icon: https://lifetrial.lifetimepc.com.br/logo.png
    
  - name: LifeTrial API
    url: https://lifetrial.lifetimepc.com.br/api/health
    expectedStatusCodes:
      - 200
      - 201
    
  - name: LifeTrial Backend
    url: https://api.lifetrial.lifetimepc.com.br/health
    expectedStatusCodes:
      - 200

  # ============ LIFETIME PRINCIPAL ============
  - name: LifeTime Website
    url: https://www.lifetimepc.com.br
    
  - name: LifeTime API Clinical Trials
    url: https://www.lifetimepc.com.br/api/clinical-trials/studies/find?size=1
    expectedStatusCodes:
      - 200

  # ============ SERVIÇOS AUXILIARES ============
  - name: LifeTime Pesquisa Clínica
    url: https://lifetimepc.com.br

  # ============ PRODUTOS ADICIONADOS 13/08/2026 ============
  # Estavam em producao confirmada e fora de qualquer monitoramento.
  # EvolutionAPI e n8n sao dependencia transversal: se caem, todo disparo de
  # WhatsApp e todo funil de captacao de lead do ecossistema para junto.
  - name: EvolutionAPI (gateway WhatsApp)
    url: https://evolution.lifetimepc.com.br

  - name: n8n (automacao de leads)
    url: https://n8n.lifetimepc.com.br

  - name: LifeMatch
    url: https://match.lifetimepc.com.br/health
    expectedStatusCodes:
      - 200

  - name: LifeDCT
    url: https://lifedct.lifetimepc.com.br

  - name: LifeScan
    url: https://scan.lifetimepc.com.br

# Configurações de status
status-website:
  cname: status.lifetimepc.com.br
  logoUrl: https://www.lifetimepc.com.br/logo.png
  name: LifeTime Status
  introTitle: "**Status dos Serviços LifeTime**"
  introMessage: Monitoramento em tempo real de todos os serviços LifeTime e LifeTrial. Esta página é atualizada automaticamente a cada 5 minutos.
  navbar:
    - title: Status
      href: /
    - title: LifeTime
      href: https://www.lifetimepc.com.br
    - title: LifeTrial
      href: https://lifetrial.lifetimepc.com.br
  theme: dark
  
# Configurações de incidentes
i18n:
  activeIncidents: Incidentes Ativos
  allSystemsOperational: Todos os sistemas operacionais
  incidentReport: "Relatório de Incidente #$NUMBER"
  pastIncidents: Incidentes Anteriores
  scheduledMaintenance: Manutenção Programada
  overallUptime: Uptime geral
  overallUptimeTitle: Uptime nos últimos 90 dias
  liveStatus: Status ao vivo
  
# Notificacoes — NENHUMA configurada (13/08/2026). Monitoramento sem alerta
# e decorativo: mesmo com o cron rodando, uma queda so gera um commit
# automatico neste repo, que ninguem olha. Para ativar o Slack:
#   1. Criar um Incoming Webhook no Slack (app.slack.com/apps -> Incoming
#      Webhooks), copiar a URL.
#   2. Nas configuracoes deste repo no GitHub: Settings > Secrets and
#      variables > Actions > New repository secret, nome SLACK_WEBHOOK_URL,
#      valor a URL do passo 1.
#   3. Descomentar o bloco `- type: slack` abaixo.
# Sem o secret configurado, NAO descomentar — a Action de notificacao falha
# procurando uma variavel que nao existe.
notifications:
  # Slack
  # - type: slack
  #   channel: monitoring
  #   url: $SLACK_WEBHOOK_URL

  # Email (via SMTP)
  # - type: email
  #   to: suporte@lifetimepc.com.br

# Configurações de commits
commitMessages:
  statusChange: "🔔 $SITE_NAME está $STATUS"
  degradedPerformance: "⚠️ $SITE_NAME com performance degradada"
  scheduleRecovery: "✅ $SITE_NAME recuperado"
  startIncident: "🚨 Incidente iniciado: $SITE_NAME"
  closeIncident: "✅ Incidente resolvido: $SITE_NAME"

# Intervalo de verificação (em minutos)
workflowSchedule:
  graphs: "0 0 * * *"        # Gráficos: 1x por dia
  responseTime: "0 23 * * *"  # Response time: 1x por dia
  staticSite: "0 1 * * *"     # Site estático: 1x por dia
  summary: "0 0 * * *"        # Sumário: 1x por dia
  updateTemplate: "0 0 * * *" # Template: 1x por dia
  updates: "*/5 * * * *"      # Checks: a cada 5 minutos
  uptime: "*/5 * * * *"       # Uptime: a cada 5 minutos

# Commits automáticos
commitPrefixStatusUp: "✅"
commitPrefixStatusDown: "🚨"
commitPrefixStatusDegraded: "⚠️"

